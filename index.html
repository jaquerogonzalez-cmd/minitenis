<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minitenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece8de; --ink: #1d2433; --muted: #6b6f78; --panel: #fbf9f4; --line: #d8d2c4; --soft: #f1ede4;
    --board: #121a2b; --board-ink: #f3f1ea; --lime: #d9ec4b; --accent: #1d2433;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a22; --ink: #eef0f3; --muted: #9aa1ad; --panel: #1f2631; --line: #36404f; --soft: #262e3a;
      --board: #0b1019; --accent: #d9ec4b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a22; --ink: #eef0f3; --muted: #9aa1ad; --panel: #1f2631; --line: #36404f; --soft: #262e3a;
    --board: #0b1019; --accent: #d9ec4b; color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .score {
    width: calc(100% - 24px); max-width: 400px; margin: 10px 12px 6px;
    background: var(--board); color: var(--board-ink);
    border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums;
  }
  .row { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 0.95rem; }
  .row .srv { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row .flag { width: 18px; height: 12px; flex: none; border-radius: 2px; }
  .row.serving .srv { background: var(--lime); }
  .row .cc { font-size: 0.72rem; opacity: 0.6; width: 26px; flex: none; }
  .row .nm { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sets { display: flex; }
  .row .sta { width: 30px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden; flex: none; }
  .row .sta i { display: block; height: 100%; width: 100%; background: #7be08a; border-radius: 3px; transition: width 0.2s; }
  .row .sta i.low { background: #ff7a59; }
  .row .st { width: 18px; text-align: center; opacity: 0.6; }
  .row .st.cur { opacity: 1; font-weight: 700; }
  .row .pt { min-width: 34px; text-align: center; background: var(--lime); color: #121a2b; border-radius: 5px; font-weight: 800; }
  .score .meta { display: flex; gap: 12px; font-size: 0.75rem; padding-top: 2px; }
  .score .meta span { opacity: 0.65; }
  .score .meta #metaL { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .score .meta [role="button"] { cursor: pointer; opacity: 0.85; text-decoration: underline; text-underline-offset: 2px; }

  .stage { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; padding: 0 10px; }
  .frame { position: relative; }
  canvas#c { display: block; width: 100%; height: 100%; border-radius: 14px; touch-action: none; }
  canvas#c:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(18, 26, 43, 0.5); border-radius: 14px; padding: 12px;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); color: var(--ink); border-radius: 14px; padding: 18px 16px;
    width: 100%; max-width: 330px; max-height: 100%; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card h2 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .card h3 { margin: 14px 0 6px; font-size: 1rem; font-weight: 800; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
  .lbl { display: block; font-size: 0.85rem; font-weight: 700; margin: 10px 0 5px; }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; font-size: 0.88rem; padding: 7px 4px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .primary {
    width: 100%; font: inherit; font-weight: 800; font-size: 1.05rem; padding: 11px; margin-top: 12px;
    border: 0; border-radius: 10px; background: var(--lime); color: #121a2b; cursor: pointer;
  }
  .secondary {
    width: 100%; font: inherit; font-size: 0.95rem; padding: 9px; margin-top: 8px;
    border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .surfs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .surfs button, .roster button, .tours button {
    font: inherit; cursor: pointer; border: 1.5px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink);
  }
  .surfs button { font-size: 0.78rem; line-height: 1.15; padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .surfs button[aria-pressed="true"], .roster button[aria-pressed="true"], .tours button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .sw { width: 34px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sw i { width: 22px; height: 12px; border: 1.5px solid rgba(255,255,255,0.9); display: block; }

  .roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .roster button > span { min-width: 0; overflow-wrap: anywhere; }
  .roster button { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 2px; text-align: left; }
  .roster button:disabled { opacity: 0.35; cursor: not-allowed; }
  .roster canvas { width: 40px; height: 52px; flex: none; }
  .roster b { display: block; font-size: 0.86rem; line-height: 1.1; }
  .roster small { display: block; font-size: 0.72rem; color: var(--muted); }

  .detail { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .detail .who { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px; }
  .detail .who b { font-size: 1.05rem; }
  .detail .who span { font-size: 0.78rem; color: var(--muted); }
  .bar { display: grid; grid-template-columns: 70px 1fr 24px; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 5px; }
  .bar i { height: 7px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .bar i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--ink); border-radius: 4px; }
  .bar b { text-align: right; font-variant-numeric: tabular-nums; }
  .fav { font-size: 0.8rem; margin-top: 7px; color: var(--muted); }

  .tours { display: grid; gap: 6px; }
  .tours button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: left; }
  .tours b { display: block; font-size: 0.92rem; }
  .tours small { display: block; font-size: 0.75rem; color: var(--muted); }
  .tours .cup { margin-left: auto; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }

  .round { margin-top: 10px; }
  .round h3 { margin: 0 0 4px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
  .m { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; font-size: 0.84rem; padding: 5px 8px; border-radius: 7px; background: var(--soft); margin-bottom: 4px; }
  .m.me { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .m span:last-of-type { text-align: right; }
  .m .w { font-weight: 800; }
  .m .l { opacity: 0.5; text-decoration: line-through; }
  .m small { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.74rem; margin-top: -2px; }
  .m em { font-style: normal; color: var(--muted); font-size: 0.75rem; }

  .tierhead { margin: 12px 0 6px; }
  .tierhead:first-of-type { margin-top: 4px; }
  .tier { display: inline-block; font-size: 0.75rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; }
  .tier.t-leyenda { background: linear-gradient(90deg, #2b1d4a, #5b3d99); color: #f4d35e; }
  .tier.t-oro { background: #e9c64a; color: #3a2a00; }
  .tier.t-plata { background: #cfd4da; color: #2a2f36; }
  .roster button.t-leyenda { border-color: #b69a3a; }
  .roster button.new { justify-content: center; font-weight: 700; min-height: 60px; border-style: dashed; text-align: center; padding: 6px; }
  .ctop { display: flex; gap: 12px; align-items: flex-start; }
  .ctop canvas { width: 64px; height: 84px; background: var(--soft); border-radius: 10px; flex: none; }
  .ctop .f { flex: 1; min-width: 0; }
  .ctop input { width: 100%; font: inherit; padding: 7px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 6px; }
  .ccsel { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .ccsel canvas { width: 27px; height: 18px; flex: none; border-radius: 2px; }
  .ccsel select { flex: 1; min-width: 0; font: inherit; font-size: 0.85rem; padding: 6px 6px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .ctop input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .sws { display: flex; flex-wrap: wrap; gap: 7px; }
  .sws button { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.2); cursor: pointer; padding: 0; }
  .sws button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .hs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .hs button { font: inherit; font-size: 0.78rem; padding: 6px 2px; border: 1.5px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
  .hs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .stat { display: grid; grid-template-columns: 72px 30px 1fr 30px; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 6px; }
  .stat button { font: inherit; font-weight: 800; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .stat button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stat b { text-align: center; font-variant-numeric: tabular-nums; }
  .budget { font-size: 0.82rem; margin-top: 6px; color: var(--muted); }
  .pad { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stick { width: 112px; height: 112px; border-radius: 50%; background: var(--soft); border: 1.5px solid var(--line); position: relative; flex: none; touch-action: none; }
  .stick::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; border: 1.5px dashed var(--line); }
  .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--ink); opacity: 0.85; z-index: 1; transition: transform 0.08s; }
  .stick.on .knob { transition: none; }
  .btns { display: grid; grid-template-columns: repeat(2, 76px); gap: 8px; }
  .btns button {
    height: 52px; border-radius: 14px; border: 0; font: inherit; font-weight: 800; font-size: 0.88rem; color: #121a2b; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; touch-action: none;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
  }
  .btns button small { font-weight: 600; font-size: 0.68rem; opacity: 0.65; }
  .btns button.armed { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btns button.held { transform: translateY(2px); box-shadow: none; }
  .b-liftado { background: #d9ec4b; } .b-plano { background: #ff9f5a; } .b-cortado { background: #8fd3f4; } .b-globo { background: #c3a6f2; }
  @media (hover: none) { .btns button small { display: none; } }
  /* ---------- Horizontal 16:9: cancha a pantalla completa, controles encima ---------- */
  body.land { display: block; }
  .land .stage { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .land canvas#c { border-radius: 0; }
  .land .score { position: fixed; z-index: 5; top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px));
    width: 290px; margin: 0; padding: 4px 8px; opacity: 0.93; }
  .land .row { height: 22px; font-size: 0.85rem; }
  .land #view { display: none; }
  .land .pad { display: contents; }
  .land .stick { position: fixed; z-index: 5; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 118px; height: 118px; background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.45); backdrop-filter: blur(2px); }
  .land .stick::after { border-color: rgba(255,255,255,0.35); }
  .land .dpad { position: fixed; z-index: 5; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; }
  .land .dp, .land .dc { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.6); color: #fff; backdrop-filter: blur(2px); }
  .land .dp.on { background: rgba(255,255,255,0.9); color: #121a2b; }
  .land.menu-open .dpad { display: none !important; }
  .land .knob { background: rgba(255,255,255,0.85); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .land .btns { position: fixed; z-index: 5; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    grid-template-columns: repeat(2, 70px); gap: 8px; opacity: 0.9; }
  .land .btns button { height: 52px; }
  .land.menu-open .score, .land.menu-open .stick, .land.menu-open .btns { display: none; }
  .land .overlay { padding: 10px; }
  .land .card { max-width: 860px; }
  .land .card.narrow { max-width: 520px; }
  .land .roster { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .land .ycal { grid-template-columns: repeat(4, 1fr); }
  .land .bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; }
  .land .bracket .round { margin-top: 0; }
  /* Paneles divididos (creador y carrera) */
  .split { display: block; }
  .land .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .land .split .pane { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; max-height: calc(100vh - 150px); overflow-y: auto; }
  .land .split.hub { grid-template-columns: 1.15fr 1fr; }
  .pane h3 { margin-top: 0; }
  .split .pane + .pane { margin-top: 12px; }
  .land .split .pane + .pane { margin-top: 0; }
  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .actions-row button { margin-top: 0 !important; }
  .toast { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 6px; }
  /* Menú de inicio */
  .home { text-align: center; }
  .logo { margin: 4px 0 2px; font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; display: inline-flex; align-items: center; gap: 10px; }
  .logo svg { width: 36px; height: 36px; }
  .home .sub { margin: 0 0 16px; }
  .hgrid { display: grid; gap: 10px; }
  .land .hgrid { grid-template-columns: 1fr 1fr; }
  .land .hbig, .land .hhelp, .land .tutcta { grid-column: 1 / -1; }
  .land .hhelp { justify-self: center; width: 60%; }
  .hbtn, .hhelp { font: inherit; font-weight: 700; font-size: 1rem; padding: 11px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
  .hhelp { font-weight: 600; font-size: 0.92rem; background: transparent; }
  .hbig { font: inherit; cursor: pointer; border: 0; border-radius: 16px; padding: 18px 12px; background: var(--lime); color: #121a2b;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hbig b { font-size: 1.55rem; font-weight: 800; letter-spacing: 0.02em; }
  .hbig small { font-size: 0.82rem; opacity: 0.75; }
  .home .foot { margin: 12px 0 0; font-size: 0.82rem; }
  .chead { display: flex; gap: 10px; align-items: center; margin: 2px 0 10px; }
  .chead canvas { width: 40px; height: 52px; flex: none; }
  .cinfo { flex: 1; min-width: 0; }
  .cinfo b { font-size: 1.05rem; }
  .cinfo small, .elbl { display: block; color: var(--muted); font-size: 0.76rem; }
  .ebar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 5px; }
  .ebar i { display: block; height: 100%; background: #4fc26a; }
  .ebar i.low { background: #ff7a59; }
  .cmsg { background: var(--soft); border-radius: 8px; padding: 8px 10px; color: var(--ink) !important; font-size: 0.85rem !important; }
  .hint2 { font-size: 0.82rem !important; margin: 8px 0 !important; }
  .mcard { border: 1.5px solid var(--line); border-radius: 12px; padding: 7px; background: var(--panel); }
  .mcard.big { padding: 10px; border: 2px solid var(--ink); margin-bottom: 8px; }
  .mcard.mini.cur { border-color: var(--ink); }
  .mh { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mh b { font-size: 0.86rem; } .mcard.big .mh b { font-size: 1.25rem; letter-spacing: -0.01em; }
  .mh .sw { width: 24px; height: 15px; } .mh .sw i { width: 14px; height: 7px; }
  .mt { display: block; color: var(--muted); font-size: 0.78rem; margin: 1px 0 8px; }
  .slots { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
  .slot { position: relative; border: 2px solid var(--ink); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; text-align: left;
    padding: 6px 7px; min-height: 66px; display: flex; flex-direction: column; gap: 2px; cursor: default; }
  button.slot { cursor: pointer; }
  .num, .legend .num { font-weight: 800; font-size: 0.78rem; width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: #121a2b; flex: none; }
  .slot.l1 .num, .num.n1 { background: #cfd4da; } .slot.l2 .num, .num.n2 { background: #e9c64a; }
  .slot.l3 .num, .num.n3 { background: linear-gradient(90deg, #5b3d99, #2b1d4a); color: #f4d35e; }
  .slot b { font-size: 0.84rem; line-height: 1.1; padding-right: 18px; } .slot small { font-size: 0.7rem; color: var(--muted); }
  .slot em { font-style: normal; font-weight: 800; font-size: 0.75rem; }
  .slot.past, .slot.fut { opacity: 0.42; } .slot.chosen { opacity: 1; }
  .slot.sel { box-shadow: 0 0 0 3px var(--lime); }
  .slot.exb { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-height: 0; width: 42px; height: 42px; padding: 0;
    align-items: center; justify-content: center; border-radius: 10px; font-weight: 800; background: var(--lime); color: #121a2b; z-index: 1; }
  .slot.exb.done { opacity: 0.45; }
  .mcard.mini .slots { gap: 5px; margin-top: 4px; }
  .mcard.mini .slot { min-height: 30px; padding: 3px; align-items: center; justify-content: center; border-width: 1.5px; border-radius: 6px; flex-direction: row; gap: 3px; }
  .mcard.mini .num { width: 17px; height: 17px; font-size: 0.68rem; }
  .mcard.mini .exb { width: 22px; height: 22px; font-size: 0.58rem; border-radius: 6px; }
  .mres { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
  .ycal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 0.74rem; color: var(--muted); margin-bottom: 8px; }
  .crow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .crow .secondary small { display: block; font-size: 0.7rem; color: var(--muted); }
  .route { text-align: left; } .route b { display: block; } .route small { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 2px; }

      return;
    }
    const i = career.cur.slot;
    career.mejora += 0;
    const txt = advanceQuincena({ slot: i, label: 'Clasif.', short: 'Q' });
    show(`<h2>Fuera en la clasificación</h2><p>Perdiste ${score} y no entraste al cuadro.</p><p class="cmsg">${txt}</p>

  function careerTourDone() {
    const ex = exitsOf(tour), idx = ex.YOU, lvl = tour.def.lvl;

    career.mejora += mej;
    career.wildcard = idx === 0;
    if (idx === 0) career.titles.push({ name: tour.def.name, lvl, year: career.year });
    const champ = nameOf(tour.rounds[tour.n - 1][0].w);
    const t = tour;
    const txt = advanceQuincena({ tour: t, slot: career.cur.slot, label: RES_LABEL[idx], short: RES_SHORT[idx] });
    if (idx === 0) launchConfetti();
    const ptxt = `${esc(t.def.name)}: +${won} puntos de ranking y +${mej} mejoras.${idx === 0 ? ' Ganas una invitación para tu próximo torneo grande.' : ` El campeón fue ${esc(champ)}.`}`;
    show(`<h2>${idx === 0 ? '🏆 ¡Campeón!' : `Eliminado en ${LOST_IN[idx]}`}</h2>

    show(`<h2>${exState.name}</h2><p>${msg}Partido ${exState.i + 1} de 2 contra ${esc(o.name)} (${esc(o.cc)}, #${rankOf(o.id)}). Cada victoria da +2 mejoras.</p>${energyHtml()}

  function exMatchDone(w, score) {

    const r = w === 0 ? `Ganaste ${score}. ` : `Perdiste ${score}. `;
    if (exState.i < 2) return showEx(r);
    const mej = exState.wins * 2;
    career.mejora += mej; career.exDone[career.month] = true; saveCareer();
    show(`<h2>${exState.name}</h2><p>${r}Terminaste la serie con ${exState.wins} de 2 victorias: +${mej} mejoras.</p>
      <button class="primary" data-act="chub">Continuar</button>`);
  }

    help: () => show(`<h2>Cómo jugar</h2><ul class="help">
      <li><b>Moverte:</b> joystick o flechas en pantalla, o flechas/WASD en el teclado. En computador también puedes guiar a tu tenista con el ratón. Tocar la cancha para moverte se activa en Controles.</li>
      <li><b>Golpear:</b> pulsa un golpe antes de que llegue la pelota. Tu tenista lo prepara y le pega al llegar. Mientras lo mantienes, se carga (el anillo bajo tus pies) y pega más fuerte, pero caminas más lento.</li>
      <li><b>Apuntar:</b> al golpear, el joystick decide la dirección. Abajo da más profundidad, arriba más corto.</li>
      <li><b>Perfecto:</b> carga bien, ten los pies quietos y deja la pelota a un costado del cuerpo, ni encima ni al límite. Si golpeas corriendo o a último momento, sale forzado.</li>
      <li><b>Liftado (Z):</b> seguro, pica y salta. <b>Plano (X):</b> rápido y bajo, más riesgoso. <b>Cortado (C):</b> lento y el bote se muere; con el joystick arriba es una dejada. <b>Globo (V):</b> por encima del rival.</li>
      <li><b>¿Muy difícil?</b> En <b>Controles</b> elige la ayuda <b>Asistida</b>: tu tenista va solo hacia la pelota y devuelve aunque no pulses nada. También puedes cambiar el joystick por <b>flechas</b>.</li>
      <li><b>Condiciones:</b> algunos torneos se juegan con ☀️ calor (la energía baja más rápido), 💨 viento (la pelota se desvía; mira las banderas del público), ⛰️ altura (la pelota vuela más) o 🌙 de noche (público más ruidoso).</li>

  if (landMQ.addEventListener) landMQ.addEventListener('change', applyLayout);
  applyLayout();
  applyMatchup();
  resetForServe(); phase = 'setup';
  home();
  requestAnimationFrame(loop);
})();
</script>
