<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minitenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece8de; --ink: #1d2433; --muted: #6b6f78; --panel: #fbf9f4; --line: #d8d2c4; --soft: #f1ede4;
    --board: #121a2b; --board-ink: #f3f1ea; --lime: #d9ec4b; --accent: #1d2433;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a22; --ink: #eef0f3; --muted: #9aa1ad; --panel: #1f2631; --line: #36404f; --soft: #262e3a;
      --board: #0b1019; --accent: #d9ec4b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a22; --ink: #eef0f3; --muted: #9aa1ad; --panel: #1f2631; --line: #36404f; --soft: #262e3a;
    --board: #0b1019; --accent: #d9ec4b; color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .score {
    width: calc(100% - 24px); max-width: 400px; margin: 10px 12px 6px;
    background: var(--board); color: var(--board-ink);
    border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums;
  }
  .row { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 0.95rem; }
  .row .srv { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row.serving .srv { background: var(--lime); }
  .row .cc { font-size: 0.72rem; opacity: 0.6; width: 28px; flex: none; }
  .row .nm { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sets { display: flex; }
  .row .sta { width: 30px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden; flex: none; }
  .row .sta i { display: block; height: 100%; width: 100%; background: #7be08a; border-radius: 3px; transition: width 0.2s; }
  .row .sta i.low { background: #ff7a59; }
  .row .st { width: 18px; text-align: center; opacity: 0.6; }
  .row .st.cur { opacity: 1; font-weight: 700; }
  .row .pt { min-width: 34px; text-align: center; background: var(--lime); color: #121a2b; border-radius: 5px; font-weight: 800; }
  .score .meta { display: flex; gap: 12px; font-size: 0.75rem; padding-top: 2px; }
  .score .meta span { opacity: 0.65; }
  .score .meta #metaL { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .score .meta [role="button"] { cursor: pointer; opacity: 0.85; text-decoration: underline; text-underline-offset: 2px; }

  .stage { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; padding: 0 10px; }
  .frame { position: relative; }
  canvas#c { display: block; width: 100%; height: 100%; border-radius: 14px; touch-action: none; }
  canvas#c:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(18, 26, 43, 0.5); border-radius: 14px; padding: 12px;
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); color: var(--ink); border-radius: 14px; padding: 18px 16px;
    width: 100%; max-width: 330px; max-height: 100%; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card h2 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .card h3 { margin: 14px 0 6px; font-size: 1rem; font-weight: 800; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
  .lbl { display: block; font-size: 0.85rem; font-weight: 700; margin: 10px 0 5px; }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; font: inherit; font-size: 0.88rem; padding: 7px 4px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .primary {
    width: 100%; font: inherit; font-weight: 800; font-size: 1.05rem; padding: 11px; margin-top: 12px;
    border: 0; border-radius: 10px; background: var(--lime); color: #121a2b; cursor: pointer;
  }
  .secondary {
    width: 100%; font: inherit; font-size: 0.95rem; padding: 9px; margin-top: 8px;
    border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .surfs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .surfs button, .roster button, .tours button {
    font: inherit; cursor: pointer; border: 1.5px solid var(--line); border-radius: 9px; background: transparent; color: var(--ink);
  }
  .surfs button { font-size: 0.78rem; line-height: 1.15; padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .surfs button[aria-pressed="true"], .roster button[aria-pressed="true"], .tours button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .sw { width: 34px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex: none; }
  .sw i { width: 22px; height: 12px; border: 1.5px solid rgba(255,255,255,0.9); display: block; }

  .roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .roster button > span { min-width: 0; overflow-wrap: anywhere; }
  .roster button { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 2px; text-align: left; }
  .roster button:disabled { opacity: 0.35; cursor: not-allowed; }
  .roster canvas { width: 40px; height: 52px; flex: none; }
  .roster b { display: block; font-size: 0.86rem; line-height: 1.1; }
  .roster small { display: block; font-size: 0.72rem; color: var(--muted); }

  .detail { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .detail .who { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px; }
  .detail .who b { font-size: 1.05rem; }
  .detail .who span { font-size: 0.78rem; color: var(--muted); }
  .bar { display: grid; grid-template-columns: 70px 1fr 24px; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 5px; }
  .bar i { height: 7px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .bar i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--ink); border-radius: 4px; }
  .bar b { text-align: right; font-variant-numeric: tabular-nums; }
  .fav { font-size: 0.8rem; margin-top: 7px; color: var(--muted); }

  .tours { display: grid; gap: 6px; }
  .tours button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: left; }
  .tours b { display: block; font-size: 0.92rem; }
  .tours small { display: block; font-size: 0.75rem; color: var(--muted); }
  .tours .cup { margin-left: auto; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }

  .round { margin-top: 10px; }
  .round h3 { margin: 0 0 4px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
  .m { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; font-size: 0.84rem; padding: 5px 8px; border-radius: 7px; background: var(--soft); margin-bottom: 4px; }
  .m.me { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .m span:last-of-type { text-align: right; }
  .m .w { font-weight: 800; }
  .m .l { opacity: 0.5; text-decoration: line-through; }
  .m small { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.74rem; margin-top: -2px; }
  .m em { font-style: normal; color: var(--muted); font-size: 0.75rem; }

  .tierhead { margin: 12px 0 6px; }
  .tierhead:first-of-type { margin-top: 4px; }
  .tier { display: inline-block; font-size: 0.75rem; font-weight: 800; padding: 2px 9px; border-radius: 20px; }
  .tier.t-leyenda { background: linear-gradient(90deg, #2b1d4a, #5b3d99); color: #f4d35e; }
  .tier.t-oro { background: #e9c64a; color: #3a2a00; }
  .tier.t-plata { background: #cfd4da; color: #2a2f36; }
  .roster button.t-leyenda { border-color: #b69a3a; }
  .roster button.new { justify-content: center; font-weight: 700; min-height: 60px; border-style: dashed; text-align: center; padding: 6px; }
  .ctop { display: flex; gap: 12px; align-items: flex-start; }
  .ctop canvas { width: 64px; height: 84px; background: var(--soft); border-radius: 10px; flex: none; }
  .ctop .f { flex: 1; min-width: 0; }
  .ctop input { width: 100%; font: inherit; padding: 7px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 6px; }
  .ctop input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .sws { display: flex; flex-wrap: wrap; gap: 7px; }
  .sws button { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.2); cursor: pointer; padding: 0; }
  .sws button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
  .hs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .hs button { font: inherit; font-size: 0.78rem; padding: 6px 2px; border: 1.5px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
  .hs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .stat { display: grid; grid-template-columns: 72px 30px 1fr 30px; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 6px; }
  .stat button { font: inherit; font-weight: 800; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .stat button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stat b { text-align: center; font-variant-numeric: tabular-nums; }
  .budget { font-size: 0.82rem; margin-top: 6px; color: var(--muted); }
  .pad { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stick { width: 112px; height: 112px; border-radius: 50%; background: var(--soft); border: 1.5px solid var(--line); position: relative; flex: none; touch-action: none; }
  .stick::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; border: 1.5px dashed var(--line); }
  .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--ink); opacity: 0.85; z-index: 1; transition: transform 0.08s; }
  .stick.on .knob { transition: none; }
  .btns { display: grid; grid-template-columns: repeat(2, 76px); gap: 8px; }
  .btns button {
    height: 52px; border-radius: 14px; border: 0; font: inherit; font-weight: 800; font-size: 0.88rem; color: #121a2b; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; touch-action: none;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18);
  }
  .btns button small { font-weight: 600; font-size: 0.68rem; opacity: 0.65; }
  .btns button.armed { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btns button.held { transform: translateY(2px); box-shadow: none; }
  .b-liftado { background: #d9ec4b; } .b-plano { background: #ff9f5a; } .b-cortado { background: #8fd3f4; } .b-globo { background: #c3a6f2; }
  @media (hover: none) { .btns button small { display: none; } }
  @media (orientation: landscape) and (min-width: 600px) {
    :root { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    body {
      display: grid; align-items: stretch; justify-items: stretch;
      grid-template-columns: minmax(170px, 1fr) minmax(0, 1.5fr) minmax(170px, 1fr);
      grid-template-rows: 1fr 1fr; grid-template-areas: "score stage btns" "stick stage btns";
    }
    .score { grid-area: score; align-self: start; justify-self: center; width: calc(100% - 24px); max-width: 300px; margin: 14px 12px; }
    .stage { grid-area: stage; height: 100%; padding: 8px 0; }
    .pad { display: contents; }
    .stick { grid-area: stick; align-self: end; justify-self: center; margin: 0 0 22px; width: 140px; height: 140px; }
    .btns { grid-area: btns; align-self: end; justify-self: center; margin: 0 0 22px; grid-template-columns: repeat(2, 88px); gap: 10px; }
    .btns button { height: 64px; font-size: 0.95rem; }
  }
  .help { text-align: left; font-size: 0.86rem; line-height: 1.4; margin: 0 0 8px; padding-left: 18px; color: var(--ink); }
  .help li { margin-bottom: 5px; }
</style>
</head>

<div class="score" aria-live="polite">
  <div class="row" id="rowC"><span class="srv"></span><span class="cc" id="ccC"></span><span class="nm" id="nmC">Rival</span><span class="sta" title="Energía"><i id="staC"></i></span><span class="sets" id="setsC"></span><span class="pt" id="ptC">0</span></div>

</div>

<div class="pad">

  function drawCharAt(h) {

  function drawCharge() {

  function drawLanding() {

  function drawNames() {

    ctx.fillText(opp.short.toUpperCase(), CX, 48); ctx.fillText(you.short.toUpperCase(), CX, H - 46);
  }
  let stamT = 0;
  function updateStamUI(force) {
    const now = performance.now();

  }
  function drawGround() { drawCourt(); drawNames(); drawLanding(); drawCharge(); }
  function draw() {
    if (persp) {
      // el suelo se dibuja plano y luego se deforma en franjas para dar profundidad
      ctx = groundCtx; drawGround(); ctx = mainCtx;

      const STEPY = 2;
      for (let sy = 0; sy < H; sy += STEPY) {

      }
    } else { ctx = mainCtx; drawGround(); }
    ctx = mainCtx;
    const ents = [{ y: A.y, f: () => drawCharAt(A) }, { y: P.y, f: () => drawCharAt(P) }, { y: ball.y + 0.1, f: drawBall }].sort((a, b) => a.y - b.y);
    let netDone = false;
    for (const e of ents) { if (!netDone && e.y > NETY) { drawNet(); netDone = true; } e.f(); }
    if (!netDone) drawNet();

    if (phase === 'serve' && server === 0) {
      ctx.font = '700 12px "Bricolage Grotesque", sans-serif'; ctx.textAlign = 'center';

      const py = proj(CX, NETY + 160).y;

  function drawPortrait(canvas, p) {
    const c = canvas.getContext('2d'), lw = canvas.width / 3, lh = canvas.height / 3;
    c.setTransform(3, 0, 0, 3, 0, 0); c.clearRect(0, 0, lw, lh);

  let last = performance.now(), acc = 0;
  function loop(now) {

  // ================= Partidos =================
  function applyMatchup() {
    you = byId(cfg.you); opp = byId(cfg.opp); surf = SURFACES[cfg.surface];

  function scoreStr(setList, w) { return setList.map(s => `${s[w]}-${s[1 - w]}`).join(' '); }

  function matchFinished(w) {

      show(`<h2>Eliminado</h2><p>${esc(opp.name)} te ganó en ${ROUNDS[tourIndexOf(m)].toLowerCase()} (${score}). El campeón del ${T.name} fue ${esc(champ)}.</p>

  function tourIndexOf(m) { return tour.rounds.findIndex(r => r.includes(m)); }

  // ================= Torneos =================
  const tourDef = () => TOURS.find(t => t.id === tour.id);

  const shortOf = id => id === 'YOU' ? you.short : byId(id).short;
  function newTour(id) {
    const T = TOURS.find(t => t.id === id);
    cfg.surface = T.surface; surf = SURFACES[T.surface];
    const others = PLAYERS.filter(p => p.id !== cfg.you).sort(() => Math.random() - 0.5).slice(0, 7)
      .sort((a, b) => rating(b, T.surface) - rating(a, T.surface)).map(p => p.id);
    others.splice(4 + Math.floor(Math.random() * 4), 0, 'YOU');
    const slot = [0, 7, 3, 4, 2, 5, 6, 1]; // cabezas de serie repartidas
    const draw8 = slot.map(i => others[i]);
    tour = { id, r: 0, done: false, rounds: [[], [], []] };
    for (let i = 0; i < 8; i += 2) tour.rounds[0].push({ a: draw8[i], b: draw8[i + 1], w: null, score: '' });

  }

      <div class="tours">${TOURS.map(t => { const S = SURFACES[t.surface]; return `<button data-act="tourSel" data-v="${t.id}" aria-pressed="${t.id === cfg.tour}">
        <span class="sw" style="background:${S.apron}"><i style="background:${S.court[0]}"></i></span>
        <span><b>${t.name}</b><small>${S.name}${t.bo3 ? ' · grande' : ''}</small></span>
        <span class="cup">${titles[t.id] ? '🏆 ' + titles[t.id] : ''}</span></button>`; }).join('')}</div>
      <span class="lbl">Dificultad</span>${segHtml('diff', DIFF.map((d, i) => [i, d.name]), cfg.diff)}
      <button class="primary" data-act="tourGo">Elegir tenista</button>
      <button class="secondary" data-act="home">Volver</button>`);
    previewSurface(TOURS.find(t => t.id === cfg.tour).surface);
  }
  function previewSurface(k) { cfg.surface = k; surf = SURFACES[k]; marks = []; renderBoard(); }
  function setPressed(btn) { btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn)); }

  const ACT = {
    home, quick: () => { mode = 'quick'; pickScreen('you'); }, tours: toursScreen,
    pickOpp: () => pickScreen('opp'),
    sel: (b) => { pickSel = b.dataset.v; renderPick(); const el = card.querySelector(`[data-v="${pickSel}"]`); if (el) el.focus({ preventScroll: true }); },
    pickOk: () => {
      if (pickFor === 'you') {
        cfg.you = pickSel; save();
        if (mode === 'tour') { newTour(cfg.tour); showBracket(); }
        else pickScreen('opp');
      } else { cfg.opp = pickSel; save(); applyMatchup(); quickCfg(); }
    },
    surf: (b) => { setPressed(b); previewSurface(b.dataset.v); save(); },
    diff: (b) => { setPressed(b); cfg.diff = +b.dataset.v; save(); },
    sets: (b) => { setPressed(b); cfg.sets = +b.dataset.v; save(); },
    startQuick: () => { mode = 'quick'; setsToWin = cfg.sets; startMatch(); },
    rematch: () => { setsToWin = cfg.sets; startMatch(); },
    tourSel: (b) => { setPressed(b); cfg.tour = b.dataset.v; previewSurface(TOURS.find(t => t.id === cfg.tour).surface); save(); },
    tourGo: () => pickScreen('you'),
    help: () => show(`<h2>Cómo jugar</h2><ul class="help">
      <li><b>Moverte:</b> joystick, flechas/WASD o arrastrando el dedo en la cancha.</li>
      <li><b>Golpear:</b> pulsa un golpe antes de que llegue la pelota. Tu tenista lo prepara y le pega al llegar. Mientras lo mantienes, se carga (el anillo bajo tus pies) y pega más fuerte, pero caminas más lento.</li>
      <li><b>Apuntar:</b> al golpear, el joystick decide la dirección. Abajo da más profundidad, arriba más corto.</li>
      <li><b>Perfecto:</b> carga bien, ten los pies quietos y deja la pelota a un costado del cuerpo, ni encima ni al límite. Si golpeas corriendo o a último momento, sale forzado.</li>
      <li><b>Liftado (Z):</b> seguro, pica y salta. <b>Plano (X):</b> rápido y bajo, más riesgoso. <b>Cortado (C):</b> lento y el bote se muere; con el joystick arriba es una dejada. <b>Globo (V):</b> por encima del rival.</li>
      <li><b>Saque:</b> el primer toque lanza la pelota y el segundo golpea. Hazlo en lo más alto (zona verde de la barra). El joystick apunta dentro del cuadro y el botón elige el saque: Plano es fuerte, Liftado seguro.</li>
      </ul><button class="primary" data-act="home">Entendido</button>`),
    create: openCreator,
    cset: (b) => { draft.look[b.dataset.k] = b.dataset.v; if (b.dataset.k === 'shirt') draft.look.accent = b.dataset.v === '#f5f5f2' ? '#1d2433' : '#ffffff'; renderCreator(true); },
    chs: (b) => { draft.look.hs = b.dataset.v; renderCreator(true); },
    chand: (b) => { draft.lefty = b.dataset.v === '1'; renderCreator(true); },
    cfav: (b) => { draft.fav = b.dataset.v; renderCreator(true); },
    cstat: (b) => { const k = b.dataset.k; draft[k] = clamp(draft[k] + 5 * +b.dataset.d, 55, 85); renderCreator(true); },
    cback: () => renderPick(),
    csave: () => {
      const name = (draft.name || '').trim() || 'Mi Tenista';
      draft.name = name; draft.short = name.split(/\s+/).pop().slice(0, 12); draft.cc = draft.cc || 'CHI';
      custom = JSON.parse(JSON.stringify(draft)); syncCustom();
      try { localStorage.setItem('minitenis-custom', JSON.stringify(custom)); } catch (e) {}
      pickSel = 'custom'; renderPick();
    },
    playTour: () => { const T = tourDef(); setsToWin = tour.r === 2 && T.bo3 ? 2 : 1; cfg.surface = T.surface; startMatch(); },
  };
  card.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b); });

  // ================= Persistencia =================
  function save() { try { localStorage.setItem('minitenis-cfg', JSON.stringify(cfg)); } catch (e) {} }
  function saveTitles() { try { localStorage.setItem('minitenis-titulos', JSON.stringify(titles)); } catch (e) {} }
  try {
    const cu = JSON.parse(localStorage.getItem('minitenis-custom') || 'null');
    if (cu && cu.look) { custom = cu; custom.tier = 'plata'; custom.id = 'custom'; syncCustom(); }
    const c = JSON.parse(localStorage.getItem('minitenis-cfg') || 'null');
    if (c) { for (const k of Object.keys(cfg)) if (c[k] !== undefined) cfg[k] = c[k]; }
    if (!byId(cfg.you)) cfg.you = 'cruz'; if (!byId(cfg.opp) || cfg.opp === cfg.you) cfg.opp = PLAYERS.find(p => p.id !== cfg.you).id;
    if (!SURFACES[cfg.surface]) cfg.surface = 'arcilla'; if (!TOURS.find(t => t.id === cfg.tour)) cfg.tour = 'terracota';
    titles = JSON.parse(localStorage.getItem('minitenis-titulos') || '{}') || {};
  } catch (e) {}

  // ================= Controles =================
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    return unproj((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  }
  let touching = false;
  cv.addEventListener('pointerdown', e => {
    cv.focus();
    if (e.pointerType !== 'mouse') touching = true;
    const p = toCanvas(e);
    if (phase === 'serve' && server === 0) { serveAction('liftado'); return; }
    target = { x: p.x, y: e.pointerType === 'mouse' ? p.y : p.y - 55 };
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' && !touching) return;
    const p = toCanvas(e);
    target = { x: p.x, y: e.pointerType === 'mouse' ? p.y : p.y - 55 };
  });
  window.addEventListener('pointerup', () => { touching = false; });

  // ---- Botones de golpe: pulsar arma el golpe, mantener lo carga ----
  const shotBtns = [...document.querySelectorAll('[data-shot]')];
  function syncButtons() {
    shotBtns.forEach(b => { b.classList.toggle('armed', inp.armed === b.dataset.shot); b.classList.toggle('held', inp.held === b.dataset.shot); });
  }
  function pressShot(t) {
    if (!menu.hidden) return;
    if (phase === 'serve' && server === 0) { serveAction(t); return; }
    inp.armed = t; inp.held = t; inp.charge = 0; inp.since = 0; syncButtons();
  }
  function releaseShot(t) { if (inp.held === t) { inp.held = null; syncButtons(); } }
  shotBtns.forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} pressShot(b.dataset.shot); });
    const up = () => releaseShot(b.dataset.shot);
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  // ---- Joystick ----
  const stick = $('stick'), knob = $('knob'); let stickId = null;
  function moveStick(e) {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const R = r.width * 0.36, m = Math.hypot(dx, dy);
    if (m > R) { dx *= R / m; dy *= R / m; }
    inp.sx = dx / R; inp.sy = dy / R; target = null;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  stick.addEventListener('pointerdown', e => { e.preventDefault(); stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {} stick.classList.add('on'); moveStick(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
  const endStick = e => { if (e.pointerId !== stickId) return; stickId = null; inp.sx = 0; inp.sy = 0; knob.style.transform = ''; stick.classList.remove('on'); };
  stick.addEventListener('pointerup', endStick); stick.addEventListener('pointercancel', endStick);
  const KEY_SHOT = { z: 'liftado', j: 'liftado', x: 'plano', k: 'plano', c: 'cortado', l: 'cortado', v: 'globo', i: 'globo' };

  window.addEventListener('keydown', e => {
    if (!menu.hidden) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[k] = true;
    if (e.repeat) return;
    if ((k === ' ' || k === 'Enter') && phase === 'serve' && server === 0) serveAction('liftado');
    if (KEY_SHOT[k]) pressShot(KEY_SHOT[k]);
  });
  window.addEventListener('keyup', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = false;
    if (KEY_SHOT[k]) releaseShot(KEY_SHOT[k]);
  });

  const btnish = (el, fn) => { el.addEventListener('click', fn); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); };
  btnish($('sound'), () => { soundOn = !soundOn; $('sound').textContent = 'Sonido: ' + (soundOn ? 'sí' : 'no'); });
  btnish($('quit'), () => { if (menu.hidden) home(); });
  function setView(v) { persp = v; $('view').textContent = 'Vista: ' + (persp ? '2.5D' : 'cenital'); try { localStorage.setItem('minitenis-vista', persp ? '25d' : 'top'); } catch (e) {} }
  btnish($('view'), () => setView(!persp));
  try { if (localStorage.getItem('minitenis-vista') === 'top') setView(false); } catch (e) {}

  // ================= Tamaño =================
  function fit() {
    const st = document.querySelector('.stage');
    const aw = st.clientWidth - 20, ah = st.clientHeight - 4;
    const s = Math.min(aw / W, ah / H);
    const f = $('frame');
    f.style.width = Math.floor(W * s) + 'px'; f.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  applyMatchup();
  resetForServe(); phase = 'setup';
  home();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
